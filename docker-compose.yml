services:
  postgres:
    image: postgres:17-alpine
    container_name: student-management-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: student_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d student_management"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: student-management-api

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/student_management?schema=public
      JWT_SECRET: replace-this-in-production
      JWT_EXPIRES_IN: 15m
      CORS_ORIGIN: http://localhost:3000

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
